components:
  schemas:
    Author:
      type: "object"
      description: "Details about an author of the image"
      properties:
        '@type':
          type: "string"
          description: "UType as type discriminator"
        name:
          type: "string"
          description: "Name of the author"
        email:
          type: "string"
          description: "Contact email address for the author"
        role:
          type: "string"
          description: "Role of the author; default maintainer"
        github:
          type: "string"
          description: "GitHub username"
        gitlab:
          type: "string"
          description: "GitLab username"
        orcid:
          type: "string"
          description: "ORCID identity"
        affiliation:
          type: "string"
          description: "Affiliation"
        _id:
          type: "integer"
          description: "surrogate key"
      required:
      - "name"
      - "email"
      additionalProperties: false
    OCIRegistry:
      type: "object"
      description: "Details about the OCIcontainer registry"
      properties:
        '@type':
          type: "string"
          description: "UType as type discriminator"
        host:
          type: "string"
          description: "Container registry hostname"
        project:
          type: "string"
          description: "Container registry project/namespace"
        _id:
          type: "integer"
          description: "surrogate key"
      required:
      - "host"
      - "project"
      additionalProperties: false
    Discovery:
      type: "object"
      description: "Discovery metadata mapped to OCI labels/annotations"
      properties:
        '@type':
          type: "string"
          description: "UType as type discriminator"
        imageTitle:
          type: "string"
          description: "Human-readable title (schema field: title)"
        description:
          type: "string"
          description: "Human-readable description (1..255 chars)"
        source:
          type: "string"
          format: "uri"
          description: "Source code URL"
        url:
          type: "string"
          format: "uri"
          description: "Project URL"
        documentation:
          type: "string"
          format: "uri"
          description: "Documentation URL"
        version:
          type: "string"
          description: "Packaged software version"
        revision:
          type: "string"
          description: "Source control revision; default unknown"
        created:
          type: "string"
          format: "date-time"
          description: "Metadata processing timestamp (UTC)"
        authors:
          type: "array"
          items:
            type: "number"
          description: "Responsible people/organization"
        licenses:
          type: "string"
          description: "SPDX license expression"
        keywords:
          type: "array"
          items:
            type: "string"
          description: "Discovery/search keywords"
        domain:
          type: "array"
          items:
            type: "string"
          description: "Scientific domains; default astronomy; min_length=1"
        kind:
          type: "array"
          items:
            type: "string"
          description: ""
        tools:
          type: "array"
          items:
            type: "string"
          description: "Scientific software packages included"
        isBase:
          type: "boolean"
          description: "Whether this is a certified base image that should be used\
            \ as a parent image for derived images"
        deprecated:
          type: "boolean"
          description: "Deprecation status; default false"
        _id:
          type: "integer"
          description: "surrogate key"
      required:
      - "imageTitle"
      - "description"
      - "source"
      - "version"
      - "authors"
      - "licenses"
      - "domain"
      - "kind"
      - "isBase"
      additionalProperties: false
    EnvVar:
      type: "object"
      description: "Environment variable map entry"
      properties:
        '@type':
          type: "string"
          description: "UType as type discriminator"
        name:
          type: "string"
          description: "Environment variable name"
        value:
          type: "string"
          description: "Environment variable value"
        _id:
          type: "integer"
          description: "surrogate key"
      required:
      - "name"
      - "value"
      additionalProperties: false
    Vulnerability:
      type: "object"
      description: "a known security vulnerability"
      properties:
        '@type':
          type: "string"
          description: "UType as type discriminator"
        cve:
          type: "string"
          description: "the identifier for the vulnerability"
        _id:
          type: "integer"
          description: "surrogate key"
      required:
      - "cve"
      additionalProperties: false
    Compliance:
      type: "object"
      description: "attestation information"
      properties:
        '@type':
          type: "string"
          description: "UType as type discriminator"
        _id:
          type: "integer"
          description: "surrogate key"
      required: []
      additionalProperties: false
    SecurityMetadata:
      type: "object"
      description: "Security metadata for a tool image"
      properties:
        '@type':
          type: "string"
          description: "UType as type discriminator"
        digest:
          type: "string"
          description: "a digest style signature"
        vulnerabilities:
          type: "array"
          items:
            $ref: "#/components/schemas/Vulnerability"
        compliance:
          type: "array"
          items:
            $ref: "#/components/schemas/Compliance"
        _id:
          type: "integer"
          description: "surrogate key"
      required:
      - "digest"
      additionalProperties: false
    ToolImage:
      type: "object"
      description: "Definition of a tool image"
      properties:
        '@type':
          type: "string"
          description: "UType as type discriminator"
        registry:
          oneOf:
          - type: "number"
          - $ref: "#/components/schemas/OCIRegistry"
          description: "OCI registry details"
        parentImage:
          oneOf:
          - type: "number"
          - $ref: "#/components/schemas/ToolImage"
          description: "Parent image reference"
        build:
          type: "object"
          $ref: "#/components/schemas/BuildProcess"
        discovery:
          type: "object"
          $ref: "#/components/schemas/Discovery"
        security:
          type: "object"
          $ref: "#/components/schemas/SecurityMetadata"
        _id:
          type: "integer"
          description: "surrogate key"
      required:
      - "registry"
      - "build"
      - "discovery"
      - "security"
      additionalProperties: false
    BuildProcess:
      type: "object"
      description: "How the tool image is built"
      properties:
        '@type':
          type: "string"
          description: "UType as type discriminator"
        buildCommand:
          type: "string"
          description: "The command used to build the image, e.g. 'docker build .'"
        buildContext:
          type: "string"
          description: "The context directory for the build, e.g. './'"
        dockerfilePath:
          type: "string"
          description: "The path to the Dockerfile, e.g. './Dockerfile'"
        _id:
          type: "integer"
          description: "surrogate key"
      required:
      - "buildCommand"
      additionalProperties: false
    Tool:
      type: "object"
      description: "Definition of a Library Tool"
      properties:
        '@type':
          type: "string"
          description: "UType as type discriminator"
        id:
          type: "string"
          description: "Unique tool identifier"
        image:
          oneOf:
          - type: "number"
          - $ref: "#/components/schemas/ToolImage"
          description: "Tool container image reference"
        command:
          type: "array"
          items:
            type: "string"
          description: "Tokenized initial command; supports {{inputs.key}} min_length=1"
        env:
          type: "array"
          items:
            $ref: "#/components/schemas/EnvVar"
        interface:
          type: "object"
          $ref: "#/components/schemas/ToolInterface"
        performanceProfile:
          type: "object"
          $ref: "#/components/schemas/PerformanceProfile"
      required:
      - "id"
      - "image"
      - "command"
      - "interface"
      - "performanceProfile"
      additionalProperties: false
    PerformanceProfile:
      type: "object"
      description: "A performance profile for Tool execution"
      properties:
        '@type':
          type: "string"
          description: "UType as type discriminator"
        processorScaling:
          type: "object"
          $ref: "#/components/schemas/ProcessorScaling"
        dataScaling:
          type: "object"
          $ref: "#/components/schemas/DataScaling"
        _id:
          type: "integer"
          description: "surrogate key"
      required:
      - "processorScaling"
      - "dataScaling"
      additionalProperties: false
    ProcessorScaling:
      type: "object"
      description: "The scaling behaviour of a tool with respect to the number of\
        \ processors used"
      properties:
        '@type':
          type: "string"
          description: "UType as type discriminator"
        _id:
          type: "integer"
          description: "surrogate key"
      required: []
      additionalProperties: false
    DataScaling:
      type: "object"
      description: "The scaling behaviour of a tool with respect to the size of the\
        \ input data"
      properties:
        '@type':
          type: "string"
          description: "UType as type discriminator"
        _id:
          type: "integer"
          description: "surrogate key"
      required: []
      additionalProperties: false
