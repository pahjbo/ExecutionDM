components:
  schemas:
    ValueEncoding:
      description: "How a parameter value is encoded for exchange"
      enum:
      - "PLAIN"
      - "URI"
      - "BASE64"
    ParameterLiteral:
      type: "object"
      description: "A typed literal value for parameter defaults and value constraints"
      properties:
        '@type':
          type: "string"
      required:
      - "@type"
    StringLiteral:
      allOf:
      - $ref: "#/components/schemas/ParameterLiteral"
      - type: "object"
        description: "A string literal value"
        properties:
          value:
            type: "string"
            description: "The string value"
        required:
        - "value"
      unevaluatedProperties: false
    IntegerLiteral:
      allOf:
      - $ref: "#/components/schemas/ParameterLiteral"
      - type: "object"
        description: "An integer literal value"
        properties:
          value:
            type: "integer"
            description: "The integer value"
        required:
        - "value"
      unevaluatedProperties: false
    RealLiteral:
      allOf:
      - $ref: "#/components/schemas/ParameterLiteral"
      - type: "object"
        description: "A floating-point literal value"
        properties:
          value:
            type: "number"
            description: "The real value"
        required:
        - "value"
      unevaluatedProperties: false
    BooleanLiteral:
      allOf:
      - $ref: "#/components/schemas/ParameterLiteral"
      - type: "object"
        description: "A boolean literal value"
        properties:
          value:
            type: "boolean"
            description: "The boolean value"
        required:
        - "value"
      unevaluatedProperties: false
    UriLiteral:
      allOf:
      - $ref: "#/components/schemas/ParameterLiteral"
      - type: "object"
        description: "A URI literal value"
        properties:
          value:
            type: "string"
            format: "uri"
            description: "The URI value"
        required:
        - "value"
      unevaluatedProperties: false
    JsonLiteral:
      allOf:
      - $ref: "#/components/schemas/ParameterLiteral"
      - type: "object"
        description: "A JSON literal value used for structured defaults"
        properties:
          value:
            type: "string"
            description: "A JSON document representing object or array content"
        required:
        - "value"
      unevaluatedProperties: false
    ParameterType:
      type: "object"
      description: "The kind of the parameter"
      properties:
        '@type':
          type: "string"
      required:
      - "@type"
    FileParameterType:
      allOf:
      - $ref: "#/components/schemas/ParameterType"
      - type: "object"
        description: "a parameter type that is a file"
        properties:
          mime:
            type: "string"
            description: "mime type describing the file"
        required: []
      unevaluatedProperties: false
    AtomicParameterType:
      allOf:
      - $ref: "#/components/schemas/ParameterType"
      - type: "object"
        description: "a parameterType that typically can be represented by primitive"
        properties:
          kind:
            type: "string"
            description: "the type of the parameter"
        required:
        - "kind"
      unevaluatedProperties: false
    ParameterSemantics:
      type: "object"
      description: "a base type for semantics"
      properties:
        '@type':
          type: "string"
      required:
      - "@type"
    IVOASemantics:
      allOf:
      - $ref: "#/components/schemas/ParameterSemantics"
      - type: "object"
        description: ""
        properties:
          ucd:
            type: "string"
            description: "a UCD"
          utype:
            type: "string"
            description: "a Utype"
        required: []
      unevaluatedProperties: false
    ParameterDefinition:
      type: "object"
      description: "the definition of a parameter"
      properties:
        '@type':
          type: "string"
          description: "UType as type discriminator"
        name:
          type: "string"
          description: "Parameter name"
        description:
          type: "string"
          description: "Parameter description"
        kind:
          $ref: "#/components/schemas/ParameterType"
          description: "the type of the parameter"
        defaultValue:
          $ref: "#/components/schemas/ParameterLiteral"
          description: "A typed default value used when no explicit value is supplied"
        encoding:
          $ref: "#/components/schemas/ValueEncoding"
          description: "Preferred exchange encoding for this parameter value"
        semantics:
          $ref: "#/components/schemas/ParameterSemantics"
          description: "Optional semantic annotation for this parameter"
        _id:
          type: "integer"
          description: "surrogate key"
      required:
      - "name"
      - "kind"
      additionalProperties: false
    ParameterGroup:
      type: "object"
      description: "a group of parameter Definitions"
      properties:
        '@type':
          type: "string"
          description: "UType as type discriminator"
        name:
          type: "string"
          description: "Group name"
        members:
          type: "array"
          items:
            $ref: "#/components/schemas/ParameterOrGroup"
        _id:
          type: "integer"
          description: "surrogate key"
      required:
      - "name"
      - "members"
      additionalProperties: false
    ParameterOrGroup:
      type: "object"
      description: "a 'choice' type"
      properties:
        '@type':
          type: "string"
          description: "UType as type discriminator"
        param:
          oneOf:
          - type: "number"
          - $ref: "#/components/schemas/ParameterDefinition"
          description: ""
        group:
          oneOf:
          - type: "number"
          - $ref: "#/components/schemas/ParameterGroup"
          description: ""
        required:
          type: "boolean"
          description: "Whether this parameter/group must be provided by clients"
        minItems:
          type: "integer"
          description: "Minimum number of items allowed in the array"
        maxItems:
          type: "integer"
          description: "Maximum number of items allowed in the array"
        _id:
          type: "integer"
          description: "surrogate key"
      required: []
      additionalProperties: false
    ToolInterface:
      type: "object"
      description: "The definition of the tool interface"
      properties:
        '@type':
          type: "string"
          description: "UType as type discriminator"
        parameters:
          type: "array"
          items:
            $ref: "#/components/schemas/ParameterDefinition"
        groups:
          type: "array"
          items:
            $ref: "#/components/schemas/ParameterGroup"
        input:
          oneOf:
          - type: "number"
          - $ref: "#/components/schemas/ParameterGroup"
          description: "The group of of parameters that are required for tool execution\
            \ - i.e. input"
        output:
          oneOf:
          - type: "number"
          - $ref: "#/components/schemas/ParameterGroup"
          description: "The group of parameters that are produced by tool execution\
            \ - i.e. output"
        _id:
          type: "integer"
          description: "surrogate key"
      required: []
      additionalProperties: false
